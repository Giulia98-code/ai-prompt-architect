    // 1. TRADUZIONI INTERFACCIA
    const translations = {
      it: {
        subtitle: "Genera istantaneamente prompt avanzati e strutturati per Midjourney, ChatGPT e Stable Diffusion.",

        upsellDesc: "Ottieni l'accesso immediato alla libreria completa con stili per UI/UX, Loghi 3D, Mockup e Strategy Frameworks + Guida PDF.",
        buyBtn: "Sblocca il Master Vault (€4.99) →",
        options: [
          "🎨 Brand Identity: Logo Minimal e Vettoriale",
          "💻 UI/UX Design: Dashboard SaaS Dark Mode",
          "📸 Fotografia Editoriale: Ritratto Cinematico",
          "📱 Social Strategy: Carousel Copywriting Framework"
        ]
      },
      en: {
        subtitle: "Instantly generate advanced, structured prompts for Midjourney, ChatGPT, and Stable Diffusion.",
        step1Title: "1. Select Your Use Case",
        selectLabel: "Choose design category:",
        generateBtn: "⚡ Generate New Dynamic Prompt",
        copyBtn: "📋 Copy Prompt to Clipboard",
        copiedText: "Prompt copied successfully!",
        upsellTitle: "🚀 Want the full 500+ Prompt Vault?",
        upsellDesc: "Get instant access to the complete library with UI/UX styles, 3D Logos, Mockups & Strategy Frameworks + PDF Guide.",
        buyBtn: "Unlock Master Vault (€4.99) →",
        options: [
          "🎨 Brand Identity: Minimal Vector Logo",
          "💻 UI/UX Design: Dark Mode SaaS Dashboard",
          "📸 Editorial Photo: Cinematic Portrait",
          "📱 Social Strategy: Carousel Copywriting Framework"
        ]
      }
    };

    // 2. ELEMENTI DINAMICI PER COMPORRE I PROMPT
    const dynamicData = {
      brand: {
        subjects: ["fintech startup", "AI robotics company", "luxury eco-friendly brand", "cybersecurity platform", "modern architecture studio"],
        styles: ["minimalist geometric vector", "3D glossy glassmorphism logo", "bold line-art emblem", "monogram lettermark"],
        colors: ["blue and purple neon gradient", "emerald green and gold accents", "monochrome black and white", "pastel orange and cyan"],
        params: ["--v 6.0 --style raw", "--v 6.0 --ar 1:1", "--v 6.0 --no text fonts"]
      },
      uiux: {
        subjects: ["crypto wallet analytics SaaS", "AI content creation tool", "health & fitness tracking app", "e-commerce admin dashboard"],
        styles: ["dark mode with frosted glass panels", "clean minimalist neomorphism layout", "high-contrast cyberpunk aesthetic"],
        colors: ["vibrant cyan and violet glowing accents", "emerald green dark theme", "electric orange and slate gray"],
        params: ["--ar 16:9 --v 6.0", "--ar 16:9 --style raw"]
      },
      photo: {
        subjects: ["creative director in a modern studio", "tech founder working late", "editorial fashion model"],
        lighting: ["cinematic rim lighting with soft shadows", "dramatic neon noir ambient light", "natural daylight through blinds"],
        lenses: ["shot on 85mm lens, f/1.8 aperture", "50mm prime lens, natural depth of field", "35mm street photography style"],
        params: ["--ar 4:5 --v 6.0", "--ar 16:9 --v 6.0"]
      },
      copy: {
        topics: [
          "5 Micro-interactions that Boost Conversions",
          "How to Build a Design System in 2026",
          "The Future of AI in Product Design",
          "3 UX Psychology Tricks Every Designer Should Know"
        ]
      }
    };

    // FUNZIONE PER ESTRARRE UN ELEMENTO CASUALE
    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // 3. GENERAZIONE DINAMICA DEL PROMPT
    function generatePrompt() {
      const selected = document.getElementById('styleSelect').value;
      const output = document.getElementById('promptOutput');
      const box = document.getElementById('resultBox');
      let resultPrompt = "";

      if (selected === 'brand') {
        const d = dynamicData.brand;
        resultPrompt = `${getRandom(d.styles)} for a ${getRandom(d.subjects)}, ${getRandom(d.colors)}, clean Swiss typography, isolated on solid background, high contrast ${getRandom(d.params)}`;
      } else if (selected === 'uiux') {
        const d = dynamicData.uiux;
        resultPrompt = `Sleek UI/UX dashboard design for a ${getRandom(d.subjects)}, ${getRandom(d.styles)}, ${getRandom(d.colors)}, clean data visualization cards, Figma presentation style ${getRandom(d.params)}`;
      } else if (selected === 'photo') {
        const d = dynamicData.photo;
        resultPrompt = `Editorial portrait of a ${getRandom(d.subjects)}, ${getRandom(d.lighting)}, ${getRandom(d.lenses)}, high detailed skin texture, Vogue magazine aesthetic ${getRandom(d.params)}`;
      } else if (selected === 'copy') {
        const d = dynamicData.copy;
        resultPrompt = `Act as a Lead UI/UX Strategist. Write a 5-slide LinkedIn carousel outline about '${getRandom(d.topics)}'. Include slide titles, visual layout ideas, concise copy, and a strong call-to-action (CTA).`;
      }

      output.innerText = resultPrompt;
      box.classList.remove('hidden');
    }

    // 4. CAMBIO LINGUA E COPIA
    function changeLanguage() {
      const lang = document.getElementById('langSelect').value;
      const t = translations[lang];

      document.getElementById('subtitleText').innerText = t.subtitle;
      document.getElementById('step1Title').innerText = t.step1Title;
      document.getElementById('selectLabel').innerText = t.selectLabel;
      document.getElementById('generateBtn').innerText = t.generateBtn;
      document.getElementById('copyBtn').innerText = t.copyBtn;
      document.getElementById('upsellTitle').innerText = t.upsellTitle;
      document.getElementById('upsellDesc').innerText = t.upsellDesc;
      document.getElementById('buyBtn').innerText = t.buyBtn;

      const select = document.getElementById('styleSelect');
      select.options[0].text = t.options[0];
      select.options[1].text = t.options[1];
      select.options[2].text = t.options[2];
      select.options[3].text = t.options[3];
    }

    function copyToClipboard() {
      const text = document.getElementById('promptOutput').innerText;
      const lang = document.getElementById('langSelect').value;
      navigator.clipboard.writeText(text);
      alert(translations[lang].copiedText);
    }
  </script>
